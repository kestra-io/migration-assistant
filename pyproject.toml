[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kestra-migration-assistant"
dynamic = ["version"]
description = "Assess a VMware vRA / vRO estate for migration to Kestra, from its export, on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kestra Technologies" }]
keywords = ["kestra", "vmware", "vra", "vro", "aria", "orchestrator", "migration", "assessment"]
dependencies = ["PyYAML>=6.0"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
# provider: anthropic (an Anthropic API key). claude-code and openai-compatible need nothing more.
anthropic = ["anthropic>=1.0"]

[project.urls]
Homepage = "https://kestra.io/resources/migration/vra/assistant"
Repository = "https://github.com/kestra-io/migration-assistant"
Issues = "https://github.com/kestra-io/migration-assistant/issues"
Changelog = "https://github.com/kestra-io/migration-assistant/blob/main/CHANGELOG.md"

[project.scripts]
kestra-migrate = "kestra_migration_assistant.cli:main"

[dependency-groups]
# Development only, pinned; uv.lock pins everything else. `uv sync` installs them with the package.
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.dynamic]
version = { attr = "kestra_migration_assistant.__version__" }

[tool.setuptools.packages.find]
include = ["kestra_migration_assistant*"]

[tool.setuptools.package-data]
"kestra_migration_assistant.vra" = ["assets/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["kestra_migration_assistant/vra/assets", "tests/vra/conformance"]

[tool.ruff.lint]
# Defects, not style: pyflakes, pycodestyle errors, bugbear, import order, pyupgrade for 3.10, unused noqa.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "RUF100"]
# Style the code base uses on purpose: L for a list of lines, a named lambda for a one-line key, % formatting.
ignore = ["E741", "E731", "UP031"]

[tool.ruff.lint.per-file-ignores]
# Each closure here is called inside the loop iteration that defines it (re.sub callbacks, sort keys),
# never after it, so the loop variable it reads is the current one. Checked 2026-10-09.
"kestra_migration_assistant/vra/sanitize.py" = ["B023"]
"kestra_migration_assistant/vra/stages/triage.py" = ["B023"]
"kestra_migration_assistant/vra/stages/waves.py" = ["B023"]
# Tests put the repository on sys.path before importing the package, for a run without an install.
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
packages = ["kestra_migration_assistant"]
ignore_missing_imports = true
