formatVersion: 1
inputs:
  hostCount:
    type: integer
    title: Hosts
    default: 1
  register:
    type: boolean
    title: Register in IPAM
    default: true
resources:
  host:
    type: Cloud.vSphere.Machine
    properties:
      count: ${input.hostCount}
      image: example-image
      flavor: small
      ipamEnabled: ${to_string(input.register)}
