formatVersion: 1
inputs:
  hostCount:
    type: integer
    title: Hosts
    default: 1
resources:
  host:
    type: Cloud.vSphere.Machine
    properties:
      count: ${input.hostCount}
      image: example-image
      flavor: small
      networks:
        - network: ${resource.host_net.id}
  host_net:
    type: Cloud.vSphere.Network
    properties:
      networkType: existing
